name: 测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rag:
    name: RAG 离线测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装测试依赖
        run: python -m pip install "pytest>=8,<10" "PyYAML>=6,<7"

      - name: 运行离线测试
        run: pytest -q
